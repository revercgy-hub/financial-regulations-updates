plugins {
    id 'com.android.application'
}

android {
    namespace 'com.finreg.knowledgebase'
    compileSdk 35

    defaultConfig {
        applicationId 'com.finreg.knowledgebase'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.7.4'
        manifestPlaceholders = [appLabel: '金融会计与案例库']
    }

    flavorDimensions += 'connectivity'
    productFlavors {
        online {
            dimension 'connectivity'
            buildConfigField 'boolean', 'OFFLINE_BUILD', 'false'
        }
        offline {
            dimension 'connectivity'
            applicationIdSuffix '.offline'
            versionNameSuffix '-offline'
            manifestPlaceholders = [appLabel: '金融会计与案例库（离线版）']
            buildConfigField 'boolean', 'OFFLINE_BUILD', 'true'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = false
    }

    androidResources {
        noCompress += ['zip']
    }

    sourceSets {
        offline.assets.srcDir layout.buildDirectory.dir('generated/offlineAssets')
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
